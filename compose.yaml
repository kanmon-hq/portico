# ═══════════════════════════════════════════════════════════════════════
#  Portico — Docker Compose Configuration
# ═══════════════════════════════════════════════════════════════════════

services:
  portico:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-dynamodb}
      DYNAMODB_TABLE_NAME: ${DYNAMODB_TABLE_NAME:-portico_servers}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-http://dynamodb-local:8000}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      CACHE_LAYER: ${CACHE_LAYER:-two_tier}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      CACHE_L1_TTL_SECONDS: ${CACHE_L1_TTL_SECONDS:-30}
      CACHE_L2_TTL_SECONDS: ${CACHE_L2_TTL_SECONDS:-300}
      ROOT_PATH: ${ROOT_PATH:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MOCK_EXTERNAL_APIS: ${MOCK_EXTERNAL_APIS:-true}
      INSECURE_NO_GATEWAY_AUTH: ${INSECURE_NO_GATEWAY_AUTH:-true}
    depends_on:
      valkey:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8001/healthz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    user: root
    command: [ "-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data" ]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb_data:/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: dynamodb-admin
    ports:
      - "8002:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: ap-northeast-1
    profiles:
      - database
    depends_on:
      - dynamodb-local

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - monitor
    depends_on:
      - portico

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./deploy/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    profiles:
      - monitor
    depends_on:
      - prometheus

volumes:
  dynamodb_data:
  valkey_data:

