[project]
name = "portico"
dynamic = ["version"]
description = "Portico — MCP Gateway Integration Hub"
license = "MPL-2.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "pydantic>=2.7.0,<3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0,<1.0",
    "fastmcp>=3.2.0,<4.0",
    "aiosqlite>=0.20.0,<1.0",
    "redis>=5.0.0,<6.0",
    "cachetools>=5.3.0,<6.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dynamodb = [
    "boto3>=1.34.0",
]
firestore = [
    "google-cloud-firestore>=2.14.0",
]
cosmos = [
    "azure-cosmos>=4.6.0",
]
all = [
    "portico[dynamodb,firestore,cosmos]",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "1.0.0"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.8",
]

[tool.coverage.run]
source = ["src/portico"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "class .*\\bProtocol\\):",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py314"
line-length = 220
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["portico"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F841"]


